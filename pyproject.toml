[project]
name = "memoire"
version = "0.1.0"
description = "Pipeline de données — segmentation de dommages automobiles entraînée de zéro (mémoire M2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pycocotools>=2.0.7",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
train = [
    "torch>=2.2",
    "mlflow>=2.10",
    "scipy>=1.10",
]
spark = [
    "pyspark>=3.5,<5.0",
]
# Chemin d'inférence en flux (chap. 5.4) — JAMAIS dans les dépendances de base :
# ni l'entraînement ni la CI ne doivent tirer un client Kafka. kafka-python est
# du pur Python (roue py3-none-any, zéro dépendance transitive), contrairement à
# confluent-kafka qui embarque librdkafka ; l'import est différé dans
# memoire.serving.kafka_client, si bien que le package s'importe (et se teste)
# sans cet extra installé.
serve = [
    "kafka-python>=2.2,<4",
    "torch>=2.2",
    "scipy>=1.10",   # memoire.training.metrics.connected_components
]
data = [
    "dvc>=3.50",
]
docs = [
    "matplotlib>=3.7",
    "markdown>=3.5",
    "weasyprint>=60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: tests qui nécessitent les datasets réels sous ~/memoire-datasets",
    "spark: tests qui nécessitent une JVM (pyspark) — exécuter via `docker compose run --rm spark python -m pytest -m spark`",
    "kafka: tests qui nécessitent un broker Kafka réel — jamais exécutés en CI ; exécuter via `docker compose --profile serving run --rm inference python -m pytest -m kafka`",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
