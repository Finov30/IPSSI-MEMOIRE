[project]
name = "memoire"
version = "0.1.0"
description = "Pipeline de données — segmentation de dommages automobiles entraînée de zéro (mémoire M2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pycocotools>=2.0.7",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "realdata: tests qui nécessitent les datasets réels sous ~/memoire-datasets",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
